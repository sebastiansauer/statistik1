<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>R vs. IDE (RStudio/Positron): Motor und Armaturenbrett</title>
  <desc>Eigene Illustration. Links ein vereinfachter Motor (R), rechts ein vereinfachtes Armaturenbrett (IDE: RStudio/Positron). Frei verwendbar (CC0).</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dde2"/>
      <stop offset="1" stop-color="#7f8790"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f5"/>
      <stop offset="1" stop-color="#f4f1e6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a56"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="#ffffff"/>

  <!-- Titel -->
  <text x="410" y="45" text-anchor="middle" font-size="34" font-weight="700" fill="#222">R: Motor</text>
  <text x="1190" y="45" text-anchor="middle" font-size="34" font-weight="700" fill="#222">IDE (RStudio/Positron): Armaturenbrett</text>
  <line x1="25" y1="62" x2="1575" y2="62" stroke="#ccc" stroke-width="2"/>

  <!-- ================= LINKS: MOTOR ================= -->
  <g>
    <clipPath id="clipL"><rect x="40" y="80" width="740" height="500" rx="6"/></clipPath>
    <rect x="40" y="80" width="740" height="500" rx="6" fill="#2b2f36"/>
    <g clip-path="url(#clipL)">
      <!-- Motorhaube-Kante -->
      <rect x="40" y="80" width="740" height="40" fill="#14161a"/>
      <!-- Motorblock unten -->
      <rect x="110" y="400" width="420" height="190" rx="14" fill="#555c66"/>
      <rect x="130" y="420" width="380" height="30" rx="6" fill="#3f454d"/>
      <!-- Zylinderkopf / Ventildeckel -->
      <rect x="90" y="260" width="400" height="140" rx="16" fill="url(#metal)" stroke="#5b626b" stroke-width="3"/>
      <rect x="110" y="285" width="360" height="90" rx="10" fill="#aab0b7" stroke="#6b727a" stroke-width="2"/>
      <!-- Zuendkerzen-Abdeckungen -->
      <g fill="#1b1d21">
        <rect x="130" y="270" width="40" height="22" rx="4"/>
        <rect x="205" y="270" width="40" height="22" rx="4"/>
        <rect x="280" y="270" width="40" height="22" rx="4"/>
        <rect x="355" y="270" width="40" height="22" rx="4"/>
      </g>
      <!-- Schrauben -->
      <g fill="#4a5058">
        <circle cx="125" cy="335" r="9"/><circle cx="455" cy="335" r="9"/>
        <circle cx="290" cy="365" r="9"/><circle cx="290" cy="305" r="9"/>
      </g>
      <!-- Oeleinfuelldeckel -->
      <circle cx="150" cy="238" r="26" fill="#1b1d21"/>
      <circle cx="150" cy="238" r="14" fill="#3a3f46"/>
      <!-- Kabelbaum -->
      <g fill="none" stroke="#14161a" stroke-width="7" stroke-linecap="round">
        <path d="M130 270 C 110 200, 200 190, 260 230"/>
        <path d="M230 270 C 230 190, 330 170, 380 215"/>
        <path d="M330 265 C 340 200, 420 190, 470 235"/>
      </g>
      <!-- Ansaugkruemmer (Rohre) -->
      <g fill="url(#metal)" stroke="#4a5058" stroke-width="3">
        <rect x="150" y="400" width="34" height="120" rx="12"/>
        <rect x="225" y="400" width="34" height="120" rx="12"/>
        <rect x="300" y="400" width="34" height="120" rx="12"/>
        <rect x="375" y="400" width="34" height="120" rx="12"/>
      </g>
      <!-- Luftfilterkasten -->
      <path d="M470 160 L650 150 Q690 150 690 190 L690 330 Q690 360 655 365 L520 370 Q480 370 480 335 Z" fill="#101215" stroke="#2a2e34" stroke-width="4"/>
      <rect x="500" y="190" width="150" height="14" rx="4" fill="#1d2025"/>
      <rect x="500" y="220" width="150" height="14" rx="4" fill="#1d2025"/>
      <!-- Ansaugschlauch -->
      <path d="M480 300 C 430 300, 420 380, 470 400" fill="none" stroke="#0c0d10" stroke-width="46" stroke-linecap="round"/>
      <path d="M480 300 C 430 300, 420 380, 470 400" fill="none" stroke="#2a2e34" stroke-width="6" stroke-dasharray="6 14" stroke-linecap="round"/>
      <!-- Behaelter Fluessigkeit -->
      <rect x="560" y="105" width="70" height="55" rx="10" fill="#e8e6dc" opacity="0.9"/>
      <circle cx="595" cy="100" r="16" fill="#e0b400"/>
      <!-- Batterie -->
      <rect x="560" y="440" width="190" height="120" rx="8" fill="#d4d7da" stroke="#9aa0a6" stroke-width="3"/>
      <rect x="590" y="415" width="60" height="45" rx="6" fill="#c0262d"/>
      <rect x="690" y="420" width="38" height="30" rx="5" fill="#2b2f36"/>
      <!-- Oelpeilstab -->
      <path d="M85 410 q-8 -22 12 -26 q20 4 12 26 z" fill="#e0b400"/>
      <!-- Riemenscheibe -->
      <circle cx="160" cy="520" r="42" fill="#14161a"/>
      <circle cx="160" cy="520" r="18" fill="#555c66"/>
    </g>
  </g>

  <!-- ================= RECHTS: ARMATURENBRETT ================= -->
  <g>
    <clipPath id="clipR"><rect x="820" y="80" width="740" height="500" rx="6"/></clipPath>
    <g clip-path="url(#clipR)">
      <!-- Aussicht -->
      <rect x="820" y="80" width="740" height="500" fill="url(#sky)"/>
      <!-- Baeume -->
      <g fill="#4f7a4a">
        <ellipse cx="900" cy="230" rx="90" ry="90"/>
        <ellipse cx="1010" cy="250" rx="70" ry="70"/>
        <ellipse cx="1450" cy="230" rx="110" ry="100"/>
        <ellipse cx="1340" cy="250" rx="70" ry="65"/>
      </g>
      <rect x="820" y="270" width="740" height="60" fill="#6f9a5a"/>
      <!-- Strasse -->
      <polygon points="1130,270 1250,270 1480,430 900,430" fill="#6b6f75"/>
      <polygon points="1186,270 1194,270 1210,430 1170,430" fill="#f2f2f2"/>
      <!-- Dach / Spiegel -->
      <rect x="1290" y="80" width="260" height="38" rx="14" fill="#14161a"/>
      <!-- Armaturenbrett -->
      <path d="M820 400 Q1190 330 1560 400 L1560 580 L820 580 Z" fill="#1b1e23"/>
      <path d="M820 440 Q1190 380 1560 440 L1560 580 L820 580 Z" fill="#23272d"/>
      <!-- Kombiinstrument -->
      <rect x="1010" y="395" width="230" height="95" rx="18" fill="#0d1014"/>
      <circle cx="1070" cy="442" r="34" fill="#16202b" stroke="#6aa6d8" stroke-width="3"/>
      <circle cx="1180" cy="442" r="34" fill="#16202b" stroke="#6aa6d8" stroke-width="3"/>
      <line x1="1070" y1="442" x2="1090" y2="425" stroke="#f0f0f0" stroke-width="3" stroke-linecap="round"/>
      <line x1="1180" y1="442" x2="1165" y2="460" stroke="#f0f0f0" stroke-width="3" stroke-linecap="round"/>
      <!-- Bildschirm (RStudio-Panes) -->
      <rect x="1275" y="400" width="250" height="140" rx="14" fill="#0b0d10"/>
      <rect x="1285" y="410" width="230" height="120" rx="8" fill="url(#screen)"/>
      <g stroke="#9cc3e6" stroke-width="1.5" fill="#16314d">
        <rect x="1293" y="418" width="104" height="50" rx="3"/>
        <rect x="1403" y="418" width="104" height="50" rx="3"/>
        <rect x="1293" y="474" width="104" height="48" rx="3"/>
        <rect x="1403" y="474" width="104" height="48" rx="3"/>
      </g>
      <g stroke="#cfe6f5" stroke-width="2" stroke-linecap="round">
        <line x1="1302" y1="430" x2="1370" y2="430"/><line x1="1302" y1="441" x2="1350" y2="441"/><line x1="1302" y1="452" x2="1380" y2="452"/>
        <line x1="1412" y1="486" x2="1490" y2="486"/><line x1="1412" y1="498" x2="1470" y2="498"/>
      </g>
      <polyline points="1415,460 1435,438 1455,450 1475,428 1495,440" fill="none" stroke="#f2b84b" stroke-width="3"/>
      <!-- Lenkrad -->
      <ellipse cx="1120" cy="530" rx="160" ry="120" fill="none" stroke="#0b0c0e" stroke-width="30"/>
      <ellipse cx="1120" cy="530" rx="160" ry="120" fill="none" stroke="#2a2e34" stroke-width="4"/>
      <path d="M980 560 L1060 545 M1260 560 L1180 545 M1120 580 L1120 650" stroke="#0b0c0e" stroke-width="22" stroke-linecap="round"/>
      <circle cx="1120" cy="540" r="34" fill="#14161a" stroke="#555c66" stroke-width="3"/>
      <!-- Hand -->
      <path d="M850 580 Q900 470 985 470 Q1025 462 1030 485 Q1040 500 1010 515 Q990 520 975 540 L930 580 Z" fill="#d9a07a"/>
      <path d="M820 480 Q860 450 900 470 L880 580 L820 580 Z" fill="#12202f"/>
    </g>
  </g>

  <!-- Trennlinie und Beschriftung -->
  <line x1="25" y1="607" x2="1575" y2="607" stroke="#ddd" stroke-width="4"/>
  <text x="25" y="665" font-size="26" fill="#555">Abbildung: R vs. IDE (RStudio/Positron) -- R macht die Arbeit, die IDE ist für Komfort und Übersicht zuständig.</text>
</svg>
